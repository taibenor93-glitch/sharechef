<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1A1A17">
<title>ShareChef AI</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --parchment: #F5E6C8;
  --ink:       #1C1208;
  --charcoal:  #2C1A0E;
  --terra:     #C9972A;
  --terra-dim: rgba(201,151,42,0.15);
  --gold:      #E8B84B;
  --muted:     #A89060;
}

html, body {
  height: 100%;
  background: var(--ink);
  font-family: 'DM Sans', sans-serif;
  color: var(--parchment);
  overflow: hidden;
}

/* ── Background ──────────────────────────────────────────────────────────── */
.bg {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, #2E1F14 0%, var(--ink) 55%),
    radial-gradient(ellipse at 80% 80%, #1A0E0A 0%, transparent 50%);
  z-index: 0;
}

.bg-rings {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 0; opacity: 0.04; pointer-events: none;
}

.bg-rings svg { width: 120vmax; height: 120vmax; position: absolute; }

/* ── Layout ──────────────────────────────────────────────────────────────── */
.app {
  position: relative; z-index: 1;
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: space-between;
  padding: 40px 24px 48px;
}

/* ── Header ──────────────────────────────────────────────────────────────── */
.header { text-align: center; animation: fadeDown 0.8s ease both; }

.logo {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; margin-bottom: 8px;
}

.logo-icon { width: 36px; height: 36px; }

.logo-name {
  font-family: 'Playfair Display', serif;
  font-size: 24px; font-weight: 700;
  letter-spacing: -0.3px; color: var(--parchment);
}
.logo-name span { color: var(--terra); }

.logo-sub {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 3px;
  text-transform: uppercase; color: var(--muted);
}

/* ── Center ──────────────────────────────────────────────────────────────── */
.center {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 32px; width: 100%; max-width: 480px;
}

/* ── Status ──────────────────────────────────────────────────────────────── */
.status { text-align: center; animation: fadeUp 0.8s 0.2s ease both; }

.status-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 3px;
  text-transform: uppercase; color: var(--terra);
  margin-bottom: 10px;
  opacity: 0; transition: opacity 0.4s;
}
.status-label.visible { opacity: 1; }

.status-text {
  font-family: 'Playfair Display', serif;
  font-size: clamp(16px, 3.5vw, 24px);
  font-weight: 400; font-style: italic;
  color: var(--parchment); line-height: 1.4;
  min-height: 2.8em;
  display: flex; align-items: center; justify-content: center;
  padding: 0 16px;
  opacity: 0; transform: translateY(8px);
  transition: all 0.5s cubic-bezier(0.22,1,0.36,1);
}
.status-text.visible { opacity: 1; transform: translateY(0); }

/* ── Orb ─────────────────────────────────────────────────────────────────── */
.orb-wrap {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  animation: fadeUp 0.8s 0.3s ease both;
}

.orb-ring {
  position: absolute; border-radius: 50%;
  border: 1px solid var(--terra);
  opacity: 0; animation: none;
}
.orb-ring-1 { width: 160px; height: 160px; }
.orb-ring-2 { width: 210px; height: 210px; }
.orb-ring-3 { width: 260px; height: 260px; }

.orb-wrap.listening .orb-ring-1 { animation: ripple 2s 0.0s ease-out infinite; }
.orb-wrap.listening .orb-ring-2 { animation: ripple 2s 0.5s ease-out infinite; }
.orb-wrap.listening .orb-ring-3 { animation: ripple 2s 1.0s ease-out infinite; }

.orb-wrap.speaking .orb-ring-1 { animation: ripple 1.4s 0.0s ease-out infinite; border-color: var(--gold); }
.orb-wrap.speaking .orb-ring-2 { animation: ripple 1.4s 0.3s ease-out infinite; border-color: var(--gold); }
.orb-wrap.speaking .orb-ring-3 { animation: ripple 1.4s 0.6s ease-out infinite; border-color: var(--gold); }

@keyframes ripple {
  0%   { transform: scale(0.9); opacity: 0.6; }
  100% { transform: scale(1.15); opacity: 0; }
}

.orb {
  width: 120px; height: 120px; border-radius: 50%;
  background: var(--charcoal);
  border: 1.5px solid rgba(196,89,58,0.4);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative;
  transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
  box-shadow:
    0 0 0 0 var(--terra-dim),
    0 20px 60px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.05);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.orb:hover {
  transform: scale(1.04);
  border-color: rgba(196,89,58,0.7);
  box-shadow:
    0 0 40px var(--terra-dim),
    0 24px 70px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.05);
}

.orb.listening {
  background: var(--terra);
  border-color: var(--terra);
  box-shadow:
    0 0 60px rgba(196,89,58,0.4),
    0 24px 70px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.1);
}

.orb.speaking {
  background: #2A2010;
  border-color: var(--gold);
  box-shadow:
    0 0 60px rgba(201,151,42,0.3),
    0 24px 70px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.05);
}

.orb.processing {
  border-color: rgba(196,89,58,0.6);
  animation: pulse-orb 1.2s ease-in-out infinite;
}

@keyframes pulse-orb {
  0%, 100% { box-shadow: 0 0 20px var(--terra-dim), 0 20px 60px rgba(0,0,0,0.5); }
  50%       { box-shadow: 0 0 50px rgba(196,89,58,0.25), 0 20px 60px rgba(0,0,0,0.5); }
}

.mic-icon { width: 36px; height: 36px; color: var(--parchment); transition: all 0.3s; }
.orb.listening .mic-icon { color: white; }

.waveform { display: none; gap: 4px; align-items: center; height: 36px; }
.orb.speaking .mic-icon { display: none; }
.orb.speaking .waveform { display: flex; }

.wave-bar {
  width: 4px; background: var(--gold); border-radius: 2px;
  animation: wavebar 0.8s ease-in-out infinite;
}
.wave-bar:nth-child(1) { height: 10px; animation-delay: 0.00s; }
.wave-bar:nth-child(2) { height: 20px; animation-delay: 0.10s; }
.wave-bar:nth-child(3) { height: 28px; animation-delay: 0.15s; }
.wave-bar:nth-child(4) { height: 18px; animation-delay: 0.20s; }
.wave-bar:nth-child(5) { height: 24px; animation-delay: 0.05s; }
.wave-bar:nth-child(6) { height: 12px; animation-delay: 0.25s; }
.wave-bar:nth-child(7) { height: 20px; animation-delay: 0.10s; }

@keyframes wavebar {
  0%, 100% { transform: scaleY(0.4); opacity: 0.7; }
  50%       { transform: scaleY(1);   opacity: 1;   }
}

.orb-hint {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted);
  margin-top: 20px; transition: opacity 0.3s;
  animation: fadeUp 1s 0.6s ease both;
}

/* ── Transcript ───────────────────────────────────────────────────────────── */
.transcript {
  width: 100%; max-height: 120px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 8px;
  padding: 0 8px; scrollbar-width: none;
}
.transcript::-webkit-scrollbar { display: none; }

.transcript-line {
  font-size: 13px; line-height: 1.5;
  opacity: 0; transform: translateY(6px);
  transition: all 0.4s cubic-bezier(0.22,1,0.36,1);
  border-left: 2px solid transparent; padding-left: 10px;
}
.transcript-line.visible { opacity: 1; transform: translateY(0); }
.transcript-line.chef { border-color: var(--gold); color: rgba(244,239,228,0.85); font-style: italic; }
.transcript-line.user { border-color: var(--terra); color: rgba(244,239,228,0.6); }

/* ── Bottom ──────────────────────────────────────────────────────────────── */
.bottom {
  width: 100%; max-width: 480px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  animation: fadeUp 0.8s 0.5s ease both;
}

.error-banner {
  display: none;
  background: rgba(196,89,58,0.15);
  border: 1px solid rgba(196,89,58,0.4);
  border-radius: 6px; padding: 10px 16px;
  font-family: 'DM Mono', monospace;
  font-size: 11px; color: var(--terra);
  letter-spacing: 0.5px; text-align: center; width: 100%;
}
.error-banner.visible { display: block; }

.bottom-note {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(138,132,120,0.5); text-align: center;
}

/* ── Animations ──────────────────────────────────────────────────────────── */
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .app { padding: 32px 20px 40px; }
  .orb { width: 100px; height: 100px; }
  .orb-ring-1 { width: 136px; height: 136px; }
  .orb-ring-2 { width: 176px; height: 176px; }
  .orb-ring-3 { width: 216px; height: 216px; }
  .mic-icon { width: 30px; height: 30px; }
}

@media (prefers-reduced-motion: reduce) {
  .orb-ring, .wave-bar, .orb.processing { animation: none !important; }
}

/* ── Record button ───────────────────────────────────────────────────────────── */
.rec-btn {
  position: fixed; bottom: 28px; right: 24px; z-index: 100;
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--charcoal);
  border: 1.5px solid rgba(196,89,58,0.35);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.rec-btn:hover {
  border-color: rgba(196,89,58,0.7);
  box-shadow: 0 4px 24px rgba(196,89,58,0.2);
}
.rec-btn.recording {
  background: var(--terra);
  border-color: var(--terra);
  animation: rec-pulse 1.4s ease-in-out infinite;
}
@keyframes rec-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(196,89,58,0.5), 0 4px 20px rgba(0,0,0,0.4); }
  50%       { box-shadow: 0 0 0 8px rgba(196,89,58,0),  0 4px 20px rgba(0,0,0,0.4); }
}
.rec-btn svg { width: 20px; height: 20px; }

/* ── Share sheet ─────────────────────────────────────────────────────────────── */
.share-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 200;
  background: rgba(26,26,23,0.85);
  backdrop-filter: blur(8px);
  align-items: flex-end; justify-content: center;
  padding-bottom: 40px;
}
.share-overlay.visible { display: flex; }

.share-sheet {
  width: 100%; max-width: 400px;
  background: var(--charcoal);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 16px 16px 0 0;
  padding: 24px 20px 32px;
  animation: slideUp 0.35s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

.share-title {
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 3px;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 20px; text-align: center;
}

.share-actions {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.share-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 12px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04);
  color: var(--parchment);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.share-btn:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.15); }
.share-btn.download { grid-column: 1 / -1; background: rgba(196,89,58,0.15); border-color: rgba(196,89,58,0.4); color: var(--terra); }
.share-btn.download:hover { background: rgba(196,89,58,0.25); }

.share-cancel {
  margin-top: 12px; width: 100%; padding: 13px;
  background: transparent; border: none;
  font-family: 'DM Mono', monospace;
  font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted);
  cursor: pointer; transition: color 0.2s;
}
.share-cancel:hover { color: var(--parchment); }
</style>
</head>

<div class="bg"></div>

<div class="bg-rings">
  <svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="400" cy="400" r="380" stroke="white" stroke-width="0.5"/>

    <line x1="20"  y1="400" x2="780" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="400" y1="20"  x2="400" y2="780" stroke="white" stroke-width="0.5"/>
    <line x1="131" y1="131" x2="669" y2="669" stroke="white" stroke-width="0.3"/>
    <line x1="669" y1="131" x2="131" y2="669" stroke="white" stroke-width="0.3"/>
    <circle cx="400" cy="20"  r="4" fill="white"/>
    <circle cx="400" cy="780" r="4" fill="white"/>
    <circle cx="20"  cy="400" r="4" fill="white"/>

  </svg>
</div>

<div class="app">
  <div class="header">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="18" r="16" stroke="#F4EFE4" stroke-width="1.2"/>
        <circle cx="18" cy="18" r="9"  stroke="#F4EFE4" stroke-width="0.8"/>
        <circle cx="18" cy="18" r="3"  fill="#C4593A"/>
        <line x1="2"  y1="18" x2="34" y2="18" stroke="#F4EFE4" stroke-width="0.6"/>
        <line x1="18" y1="2"  x2="18" y2="34" stroke="#F4EFE4" stroke-width="0.6"/>
        <circle cx="18" cy="9"  r="1.5" fill="#F4EFE4"/>
        <circle cx="18" cy="27" r="1.5" fill="#F4EFE4"/>
        <circle cx="9"  cy="18" r="1.5" fill="#F4EFE4"/>
        <circle cx="27" cy="18" r="1.5" fill="#F4EFE4"/>
      </svg>
      <div class="logo-name">Share<span>Chef</span> AI</div>
    </div>
    <div class="logo-sub">Your Personal Kitchen Companion</div>
  </div>

  <div class="center">
    <div class="status">
      <div class="status-label" id="statusLabel">Chef is ready</div>
      <div class="status-text"  id="statusText">Tap the mic — tell me what's in your kitchen</div>
    </div>

    <div class="orb-wrap" id="orbWrap">
      <div class="orb-ring orb-ring-1"></div>
      <div class="orb-ring orb-ring-2"></div>
      <div class="orb-ring orb-ring-3"></div>
      <div class="orb" id="orb" role="button" aria-label="Tap to speak with your chef">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8"  y1="23" x2="16" y2="23"/>
        </svg>

          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>

  </div>

    <div class="error-banner" id="errorBanner"></div>
    <div class="bottom-note">ShareChef AI · Voice Cooking Companion · No Buy Guarantee</div>
  </div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let isListening  = false
let isProcessing = false
let isSpeaking   = false
let autoListen   = false
let isFirstTap   = true
let recognition  = null
let audioCtx     = null
let currentSource = null
let conversationHistory = []

const SYSTEM_PROMPT = `You are Chef AI, the warm and encouraging personal cooking companion inside ShareChef AI.
You speak like a real human chef — warm, confident, friendly, and encouraging. Never robotic.

Your personality:
- You speak to EVERYONE: a tired working mom, a 12-year-old cooking alone, a man trying to impress a date, a student with almost nothing in the fridge.
- You are patient, never judgmental, always positive.
- You guide the user step by step through cooking using ONLY the ingredients they tell you they have.
- You NEVER tell them to buy anything. Ever. Not once.
- Keep responses SHORT and conversational — this is voice. 2–4 sentences max per response.
- Ask one question at a time.
- Use simple language anyone can understand.
- Celebrate small wins ("Perfect! That smells amazing already.")

Start every first conversation by warmly greeting and asking what ingredients they have right now.
As they list ingredients, guide them toward a realistic, simple meal.
Then walk them through cooking it step by step — one step at a time — waiting for them to confirm before moving forward.`

// ── DOM ───────────────────────────────────────────────────────────────────────
const orb         = document.getElementById('orb')
const orbWrap     = document.getElementById('orbWrap')
const orbHint     = document.getElementById('orbHint')
const statusLabel = document.getElementById('statusLabel')
const statusText  = document.getElementById('statusText')
const transcript  = document.getElementById('transcript')
const errorBanner = document.getElementById('errorBanner')

// ── Speech Recognition ────────────────────────────────────────────────────────
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition

if (!SpeechRecognition) {
  showError('Voice input requires Chrome or Edge. Please switch browsers.')
}

function buildRecognition() {
  const r = new SpeechRecognition()
  r.continuous     = true
  r.interimResults = true
  r.lang           = navigator.language || 'en-US'
  let finalTranscript = ''
  let silenceTimer = null
  r.onresult = (e) => {
    if (isProcessing) return
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalTranscript += e.results[i][0].transcript
      }
    }
    clearTimeout(silenceTimer)
    silenceTimer = setTimeout(async () => {
      const userText = finalTranscript.trim()
      finalTranscript = ''
      if (!userText) return
      stopListening()
      addLine(userText, 'user')
      setStatus('processing', 'One moment…')
      await getChefResponse(userText)
    }, 400)
  }
  r.onend = () => { if (isListening) stopListening() }
  r.onerror = (e) => {
    stopListening()
    if (e.error !== 'no-speech') showError(`Mic error: ${e.error}`)
    setStatus('ready', 'Tap the mic to try again')
  }
  return r
}

// ── Orb click ─────────────────────────────────────────────────────────────────
orb.addEventListener('click', handleOrbClick)

async function handleOrbClick() {
  hideError()

  if (isSpeaking)   { stopAudio(); return }
  if (isListening)  { stopListening(); return }
  if (isProcessing) return

  if (isFirstTap) {
    isFirstTap = false
    orb.classList.add('processing')
    setStatus('processing', 'Your chef is warming up…')
    await getChefResponse(null, true)
    orb.classList.remove('processing')
    return
  }

  startListening()
}

// ── Listening ─────────────────────────────────────────────────────────────────
function startListening() {
  if (!SpeechRecognition) return
  recognition = buildRecognition()
  isListening = true
  orb.classList.add('listening')
  orbWrap.classList.add('listening')
  orbHint.style.opacity = '0'
  setStatus('listening', 'I\'m listening…')
  recognition.start()
}

function stopListening() {
  isListening = false
  orb.classList.remove('listening')
  orbWrap.classList.remove('listening')
  orbHint.style.opacity = '1'
  try { recognition?.stop() } catch (_) {}
}

// ── Audio playback ────────────────────────────────────────────────────────────
async function playAudioBase64(base64) {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)()
  }
  if (audioCtx.state === 'suspended') await audioCtx.resume()

  const binary = atob(base64)
  const bytes  = new Uint8Array(binary.length)
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i)

  const decoded = await audioCtx.decodeAudioData(bytes.buffer)

  return new Promise((resolve) => {
    currentSource        = audioCtx.createBufferSource()
    currentSource.buffer = decoded
    currentSource.connect(audioCtx.destination)
    currentSource.onended = () => { currentSource = null; resolve() }
    currentSource.start(0)
  })
}

function stopAudio() {
  try { currentSource?.stop() } catch (_) {}
  currentSource = null
  isSpeaking    = false
  orb.classList.remove('speaking')
  orbWrap.classList.remove('speaking')
  orbHint.textContent = 'Tap to speak'
  setStatus('ready', 'Your turn — tap the mic')
}

// ── Chat API ──────────────────────────────────────────────────────────────────
async function getChefResponse(userMessage, isOpening = false) {
  isProcessing = true

  try {
    if (isOpening) {
      conversationHistory.push({ role: 'user', content: 'Hello, I just opened the app.' })
    } else {
      conversationHistory.push({ role: 'user', content: userMessage })
    }

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: conversationHistory,
        systemPrompt: SYSTEM_PROMPT,
      }),
    })

    if (!res.ok) {
      const err = await res.json().catch(() => ({}))
      throw new Error(err.error || `Server error ${res.status}`)
    }

    const { text, audio } = await res.json()

    conversationHistory.push({ role: 'assistant', content: text })
    addLine(text, 'chef')
    setStatus('speaking', text)

    isSpeaking = true
    orb.classList.add('speaking')
    orbWrap.classList.add('speaking')
    orbHint.textContent = 'Tap to interrupt'

    await playAudioBase64(audio)

    // Flag for auto-listen — actual start happens after finally clears isProcessing
    if (isSpeaking) {
      isSpeaking = false
      orb.classList.remove('speaking')
      orbWrap.classList.remove('speaking')
      autoListen = true
    }

  } catch (err) {
    orb.classList.remove('processing', 'listening', 'speaking')
    orbWrap.classList.remove('listening', 'speaking')
    showError(
      err.message.includes('429') || err.message.includes('quota')
        ? 'OpenAI quota reached. Check your API plan.'
        : err.message.includes('401') || err.message.includes('key')
        ? 'API key issue. Check your .env file.'
        : err.message
    )
    setStatus('ready', 'Tap the mic to try again')
  } finally {
    isProcessing = false
  }
  // Auto-listen: delay 400ms so audio buffer fully clears before mic opens
  if (autoListen) setTimeout(() => startListening(), 200)
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function setStatus(state, text) {
  const labels = {
    listening:  '● Listening',
    processing: '◌ Thinking',
    speaking:   '♪ Chef speaking',
    ready:      'Chef is ready',
  }
  statusLabel.classList.add('visible')
  statusLabel.textContent = labels[state] || 'Chef is ready'
  statusText.classList.remove('visible')
  setTimeout(() => { statusText.textContent = text; statusText.classList.add('visible') }, 80)
}

function addLine(text, role) {
  const line = document.createElement('div')
  line.className = `transcript-line ${role}`
  line.textContent = role === 'chef' ? `Chef: ${text}` : `You: ${text}`
  transcript.appendChild(line)
  requestAnimationFrame(() => line.classList.add('visible'))
  transcript.scrollTop = transcript.scrollHeight
  const lines = transcript.querySelectorAll('.transcript-line')
  if (lines.length > 6) { lines[0].style.opacity = '0'; setTimeout(() => lines[0].remove(), 400) }
}

function showError(msg) { errorBanner.textContent = msg; errorBanner.classList.add('visible') }
function hideError()    { errorBanner.classList.remove('visible') }

// ── Boot ──────────────────────────────────────────────────────────────────────
setTimeout(() => {
  statusLabel.classList.add('visible')
  statusText.classList.add('visible')
}, 800)

// ── Screen recorder ───────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const recBtn       = document.getElementById('recBtn')
  const shareOverlay = document.getElementById('shareOverlay')
  const shareCancel  = document.getElementById('shareCancel')
  const shareDownload  = document.getElementById('shareDownload')
  const shareTikTok    = document.getElementById('shareTikTok')
  const shareInstagram = document.getElementById('shareInstagram')
  const shareFacebook  = document.getElementById('shareFacebook')

  let mediaRecorder = null
  let recordedChunks = []
  let recordingBlob  = null
  let isRecording    = false

  // ── Record button ──────────────────────────────────────────────────────────
  recBtn.addEventListener('click', async () => {
    if (isRecording) {
      stopRecording()
    } else {
      await startRecording()
    }
  })

  async function startRecording() {
    try {
      // Screen + system audio
      const screenStream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 30 },
        audio: true,
      })

      // Mic audio (best-effort — ignore if denied)
      let micStream = null
      try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }) } catch (_) {}

      // Mix streams
      const tracks = [...screenStream.getVideoTracks()]
      if (micStream || screenStream.getAudioTracks().length) {
        const ctx    = new AudioContext()
        const dest   = ctx.createMediaStreamDestination()
        if (screenStream.getAudioTracks().length) {
          ctx.createMediaStreamSource(new MediaStream(screenStream.getAudioTracks())).connect(dest)
        }
        if (micStream) {
          ctx.createMediaStreamSource(micStream).connect(dest)
        }
        tracks.push(...dest.stream.getAudioTracks())
      }

      const combined = new MediaStream(tracks)

      // Pick best supported MIME
      const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
        .find(t => MediaRecorder.isTypeSupported(t)) || ''

      recordedChunks = []
      mediaRecorder  = new MediaRecorder(combined, mime ? { mimeType: mime } : {})
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data) }
      mediaRecorder.onstop = onRecordingStop
      mediaRecorder.start(1000)

      // Stop recording if user ends screen share via browser UI
      screenStream.getVideoTracks()[0].onended = () => { if (isRecording) stopRecording() }

      isRecording = true
      recBtn.classList.add('recording')
      recBtn.setAttribute('aria-label', 'Stop recording')
      recBtn.querySelector('svg').innerHTML =
        '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>'

    } catch (err) {
      if (err.name !== 'NotAllowedError') console.error('Recording error:', err)
    }
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop()
    isRecording = false
    recBtn.classList.remove('recording')
    recBtn.setAttribute('aria-label', 'Record screen')
    recBtn.querySelector('svg').innerHTML =
      '<circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="10"/>'
  }

  function onRecordingStop() {
    const mime = mediaRecorder.mimeType || 'video/webm'
    recordingBlob = new Blob(recordedChunks, { type: mime })
    shareOverlay.classList.add('visible')
  }

  // ── Share sheet ────────────────────────────────────────────────────────────
  shareCancel.addEventListener('click', () => shareOverlay.classList.remove('visible'))
  shareOverlay.addEventListener('click', e => { if (e.target === shareOverlay) shareOverlay.classList.remove('visible') })

  shareDownload.addEventListener('click', () => {
    const ext = (recordingBlob.type.includes('mp4')) ? 'mp4' : 'webm'
    const url = URL.createObjectURL(recordingBlob)
    const a   = document.createElement('a')
    a.href     = url
    a.download = `sharechef-session.${ext}`
    a.click()
    setTimeout(() => URL.revokeObjectURL(url), 60000)
  })

  async function shareFile(platform) {
    const ext  = recordingBlob.type.includes('mp4') ? 'mp4' : 'webm'
    const file = new File([recordingBlob], `sharechef-session.${ext}`, { type: recordingBlob.type })
    const fallbacks = {
      TikTok:    'https://www.tiktok.com/upload',
      Instagram: 'https://www.instagram.com/',
      Facebook:  'https://www.facebook.com/',
    }

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'My ShareChef cooking session' })
        return
      } catch (err) {
        if (err.name === 'AbortError') return
      }
    }
    window.open(fallbacks[platform], '_blank', 'noopener')
  }

  shareTikTok.addEventListener('click',    () => shareFile('TikTok'))
  shareInstagram.addEventListener('click', () => shareFile('Instagram'))
  shareFacebook.addEventListener('click',  () => shareFile('Facebook'))
})
</script>
